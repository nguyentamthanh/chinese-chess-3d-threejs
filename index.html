<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Co Tuong 3D - Three.js</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="hud">
      <h1>Cờ Tướng 3D</h1>
      <p>Mô hình 3D cho: Tướng, Sĩ, Tượng, Xe, Pháo, Mã, Tốt.</p>
      <p>Kéo chuột để xoay, lăn chuột để zoom, click quân để chọn và đi.</p>
      <div class="controls">
        <label for="game-mode">Chế độ:</label>
        <select id="game-mode">
          <option value="ai">1 người chơi với máy</option>
          <option value="pvp">2 người chơi</option>
        </select>
        <button id="new-game-btn" type="button">Ván mới</button>
      </div>
      <p id="mode-text">Chế độ hiện tại: 1 người chơi với máy</p>
      <p id="turn-text">Lượt: Đỏ</p>
      <p id="selected-piece">Đang chọn: Chưa có</p>
      <p id="status-text">Sẵn sàng.</p>
    </div>

    <canvas id="scene"></canvas>

    <script type="module" src="./app.js"></script>
  </body>
</html>
